# Alembic configuration for AI Placement Platform.
#
# To generate a migration after changing models:
#   alembic revision --autogenerate -m "describe change"
#
# To apply migrations:
#   alembic upgrade head

[alembic]
# path to migration scripts. Use forward slashes (/) also on windows.
script_location = alembic

# The database URL is overridden at runtime by alembic/env.py using
# app.config.settings.DATABASE_URL.  The value below is a fallback.
sqlalchemy.url = postgresql://postgres:password@localhost/ai_placement_platform

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
