# ═══════════════════════════════════════════════════════════════
# AI Recruitment System — Docker Compose
# Essential infrastructure services for development
# ═══════════════════════════════════════════════════════════════

services:
  # ── PostgreSQL Database ──────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: recruitment-postgres
    environment:
      POSTGRES_DB: recruitment
      POSTGRES_USER: recruitment_user
      POSTGRES_PASSWORD: recruitment_pass
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruitment_user -d recruitment"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - recruitment-network
    restart: unless-stopped

  # ── RabbitMQ Message Broker ──────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: recruitment-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: recruitment
      RABBITMQ_DEFAULT_PASS: recruitment_queue
      RABBITMQ_DEFAULT_VHOST: /recruitment
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"    # AMQP port
      - "15672:15672"  # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - recruitment-network
    restart: unless-stopped

  # ── Redis Cache ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: recruitment-redis
    command: redis-server --appendonly yes --requirepass recruitment_cache
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - recruitment-network
    restart: unless-stopped

  # ── AI Recruitment Application (Optional - use profile) ──────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recruitment-app
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://recruitment_user:recruitment_pass@postgres:5432/recruitment
      
      # RabbitMQ
      RABBITMQ_URL: amqp://recruitment:recruitment_queue@rabbitmq:5672/recruitment
      
      # Redis
      REDIS_URL: redis://:recruitment_cache@redis:6379/0
      
      # API Keys (set in .env file)
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GITHUB_API_TOKEN: ${GITHUB_API_TOKEN:-}
      STACKOVERFLOW_API_KEY: ${STACKOVERFLOW_API_KEY:-}
      LINKEDIN_ACCESS_TOKEN: ${LINKEDIN_ACCESS_TOKEN:-}
      INDEED_API_KEY: ${INDEED_API_KEY:-}
      NAUKRI_API_KEY: ${NAUKRI_API_KEY:-}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      
      # Production settings
      PRODUCTION_MODE: ${PRODUCTION_MODE:-false}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/system/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - recruitment-network
    restart: unless-stopped
    profiles:
      - full-stack

  # ── Nginx Reverse Proxy (Production Only) ────────────────────
  nginx:
    image: nginx:alpine
    container_name: recruitment-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./uploads:/var/www/uploads:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    networks:
      - recruitment-network
    profiles:
      - production

# ── Volumes ─────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local
  redis_data:
    driver: local

# ── Networks ────────────────────────────────────────────────────
networks:
  recruitment-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16