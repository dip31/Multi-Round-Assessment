# ═══════════════════════════════════════════════════════════════
# Development Override for Docker Compose
# Use: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
# ═══════════════════════════════════════════════════════════════

version: '3.8'

services:
  # ── Development App with Hot Reload ──────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: development
    volumes:
      - .:/app
      - /app/__pycache__
      - /app/.venv
    environment:
      - PYTHONPATH=/app
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    
  # ── PostgreSQL with Development Settings ─────────────────────
  postgres:
    environment:
      POSTGRES_DB: recruitment_dev
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_pass
    ports:
      - "5433:5432"  # Different port for dev
      
  # ── RabbitMQ with Development Settings ───────────────────────
  rabbitmq:
    environment:
      RABBITMQ_DEFAULT_USER: dev_user
      RABBITMQ_DEFAULT_PASS: dev_pass
    ports:
      - "5673:5672"    # Different port for dev
      - "15673:15672"  # Different management port
      
  # ── Redis with Development Settings ──────────────────────────
  redis:
    command: redis-server --appendonly yes  # No password in dev
    ports:
      - "6380:6379"  # Different port for dev