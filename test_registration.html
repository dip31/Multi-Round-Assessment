<!DOCTYPE html>
<html>
<head>
    <title>Registration Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .form-group { margin: 10px 0; }
        label { display: block; margin-bottom: 5px; }
        input { padding: 8px; width: 200px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        .result { margin-top: 20px; padding: 10px; border: 1px solid #ccc; }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
    </style>
</head>
<body>
    <h1>Registration Test</h1>
    <form id="registrationForm">
        <div class="form-group">
            <label>Name:</label>
            <input type="text" id="name" value="Test User" required>
        </div>
        <div class="form-group">
            <label>Email:</label>
            <input type="email" id="email" value="test@example.com" required>
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input type="password" id="password" value="password123" required>
        </div>
        <button type="submit">Register</button>
    </form>
    
    <div id="result"></div>

    <script>
        document.getElementById('registrationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing registration...';
            
            try {
                // Test direct backend call
                const directResponse = await fetch('http://localhost:8000/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ name, email, password })
                });
                
                const directData = await directResponse.json();
                
                // Test proxy call
                const proxyResponse = await fetch('http://localhost:5173/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ name, email, password })
                });
                
                const proxyData = await proxyResponse.json();
                
                resultDiv.innerHTML = `
                    <div class="result success">
                        <h3>✅ Registration Test Results</h3>
                        <p><strong>Direct Backend (port 8000):</strong> ${directResponse.status} - ${JSON.stringify(directData)}</p>
                        <p><strong>Vite Proxy (port 5173):</strong> ${proxyResponse.status} - ${JSON.stringify(proxyData)}</p>
                        <p>Both endpoints are working correctly!</p>
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        <h3>❌ Registration Test Failed</h3>
                        <p><strong>Error:</strong> ${error.message}</p>
                        <p>This indicates a network or CORS issue.</p>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
